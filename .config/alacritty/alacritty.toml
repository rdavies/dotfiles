
[env]
TERM = "xterm-256color"

[font]
size = 16.0

[font.bold]
family = "SFMono Nerd Font"
style = "Semibold"

[font.italic]
family = "SFMono Nerd Font"
style = "Light Italic"

[font.normal]
family = "SFMono Nerd Font"
style = "Light"

[terminal.shell]
# Resolved via $PATH rather than a hardcoded Homebrew prefix, so this works
# on Apple Silicon, Intel, and Linux alike.
program = "fish"

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.95
option_as_alt = "Both"

[window.dimensions]
columns = 135
lines = 40

[window.padding]
x = 18
y = 16

[general]
live_config_reload = true
import = ["~/.config/alacritty/catppuccin/catppuccin-mocha.toml"]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
