# refresh source file with r
bind r source-file ~/.config/tmux/tmux.conf

# bind leader to C-a
unbind C-b
set -g prefix C-a

# number panes and windows starting at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# better split pane keybinds
bind-key | split-window -h
bind-key - split-window -v

# vim keymaps for pane switching
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# enable mouse support for when I blank on keybinds
set -g mouse on

# open new panes in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# easier switching between windows
bind C-p previous-window
bind C-n next-window
bind a last-window

# increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# focus events enabled for terminals that support them
set -g focus-events on

# better colors (tmux 3.2+ truecolor: supersedes the old
# `terminal-overrides ,xterm-256color:Tc` hack)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# list of plugins
# install plugins with <prefix>I
# update plugins with <prefix>U
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
# seamless Ctrl-hjkl pane/split navigation between tmux and Neovim
# (mirrored in nvim by lua/plugins/vim-tmux-navigator.lua)
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
